<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Weather Classifier</title>
  <link href="https://fonts.googleapis.com/css2?family=Syne:wght@400;600;700;800&family=DM+Mono:wght@400;500&display=swap" rel="stylesheet"/>
  <style>
    *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }

    :root {
      --bg:      #07070e;
      --surface: #0f0f20;
      --border:  #252540;
      --accent:  #5b8dee;
      --green:   #3dd68c;
      --text:    #ffffff;
      --sub:     #a0a0c8;       /* clearly visible light purple — replaces all gray */
      --mono:    'DM Mono', monospace;
    }

    html, body {
      background: var(--bg);
      color: var(--text);
      font-family: 'Syne', sans-serif;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      align-items: center;
      padding: 56px 28px 80px;
    }

    /* ── Header ── */
    header { text-align: center; margin-bottom: 48px; }

    header h1 {
      font-size: 58px;
      font-weight: 800;
      letter-spacing: -1.5px;
      background: linear-gradient(135deg, #7eb8f7 0%, #3dd68c 100%);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
      background-clip: text;
      margin-bottom: 12px;
    }

    header p {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 2px;
    }

    /* ── Layout ── */
    .container {
      width: 100%;
      max-width: 1100px;
      display: grid;
      grid-template-columns: 1fr 1fr;
      gap: 24px;
    }

    @media (max-width: 700px) {
      .container { grid-template-columns: 1fr; }
      header h1 { font-size: 38px; }
    }

    /* ── Cards ── */
    .card {
      background: var(--surface);
      border: 1px solid var(--border);
      border-radius: 20px;
      overflow: hidden;
    }

    /* ── Upload card ── */
    .upload-card { display: flex; flex-direction: column; }

    .upload-zone {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 48px 28px;
      border: 2px dashed var(--border);
      border-radius: 16px;
      margin: 18px;
      cursor: pointer;
      transition: border-color 0.2s, background 0.2s;
      position: relative;
      min-height: 300px;
    }

    .upload-zone:hover,
    .upload-zone.dragover {
      border-color: var(--accent);
      background: rgba(91, 141, 238, 0.05);
    }

    .upload-zone input {
      position: absolute;
      inset: 0;
      opacity: 0;
      cursor: pointer;
      width: 100%;
      height: 100%;
    }

    .upload-icon { font-size: 60px; margin-bottom: 20px; line-height: 1; }

    .upload-title {
      font-size: 24px;
      font-weight: 700;
      color: var(--text);
      margin-bottom: 10px;
    }

    .upload-sub {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 1px;
    }

    /* Preview */
    .preview-img {
      width: 100%;
      height: 100%;
      object-fit: cover;
      border-radius: 12px;
      position: absolute;
      inset: 0;
    }

    .preview-overlay {
      position: absolute;
      inset: 0;
      background: rgba(7,7,14,0.55);
      border-radius: 12px;
      display: flex;
      align-items: center;
      justify-content: center;
      opacity: 0;
      transition: opacity 0.2s;
      cursor: pointer;
      z-index: 10;
    }

    .upload-zone:hover .preview-overlay { opacity: 1; }

    .preview-overlay span {
      font-size: 15px;
      font-weight: 600;
      color: #fff;
      background: rgba(91,141,238,0.85);
      padding: 8px 20px;
      border-radius: 24px;
      pointer-events: none;
    }

    /* Button */
    .predict-btn {
      margin: 0 18px 18px;
      padding: 18px;
      background: linear-gradient(135deg, var(--accent), #3dd68c);
      color: #fff;
      font-family: 'Syne', sans-serif;
      font-size: 18px;
      font-weight: 700;
      border: none;
      border-radius: 14px;
      cursor: pointer;
      letter-spacing: 0.5px;
      transition: opacity 0.2s, transform 0.1s;
    }

    .predict-btn:hover  { opacity: 0.9; transform: translateY(-1px); }
    .predict-btn:active { transform: translateY(0); }
    .predict-btn:disabled { opacity: 0.35; cursor: not-allowed; transform: none; }

    /* ── Result card ── */
    .result-card {
      display: flex;
      flex-direction: column;
      justify-content: center;
    }

    /* Empty state */
    .empty-state {
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 56px 28px;
      text-align: center;
      height: 100%;
      min-height: 360px;
    }

    .empty-icon { font-size: 64px; margin-bottom: 18px; opacity: 0.35; }

    .empty-text {
      font-size: 22px;
      font-weight: 700;
      color: var(--sub);
      margin-bottom: 8px;
    }

    .empty-sub {
      font-family: var(--mono);
      font-size: 14px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 1px;
      opacity: 0.7;
    }

    /* Result content */
    .result-content { padding: 28px; display: none; }
    .result-content.visible { display: block; }

    .result-label {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 10px;
    }

    .result-class {
      font-size: 52px;
      font-weight: 800;
      color: var(--accent);
      text-transform: capitalize;
      line-height: 1;
      margin-bottom: 10px;
    }

    .result-conf {
      font-family: var(--mono);
      font-size: 17px;
      color: var(--green);
      margin-bottom: 16px;
    }

    .bar-bg {
      background: #13131f;
      border-radius: 8px;
      height: 8px;
      overflow: hidden;
      margin-bottom: 28px;
    }

    .bar-fill {
      height: 100%;
      border-radius: 8px;
      background: linear-gradient(90deg, var(--accent), var(--green));
      width: 0;
      transition: width 0.8s cubic-bezier(.4,0,.2,1);
    }

    /* Prob list */
    .prob-label {
      font-family: var(--mono);
      font-size: 13px;
      color: var(--sub);
      text-transform: uppercase;
      letter-spacing: 2px;
      margin-bottom: 14px;
    }

    .prob-list { display: flex; flex-direction: column; gap: 12px; }

    .prob-item {
      display: flex;
      align-items: center;
      gap: 10px;
      font-size: 16px;
    }

    .prob-name {
      width: 110px;
      text-transform: capitalize;
      font-weight: 600;
      color: var(--sub);
      flex-shrink: 0;
    }

    .prob-item.top .prob-name { color: var(--text); }

    .prob-bar-bg {
      flex: 1;
      background: #1a1a2e;
      border-radius: 6px;
      height: 6px;
      overflow: hidden;
    }

    .prob-bar-fill {
      height: 100%;
      border-radius: 6px;
      background: var(--border);
      transition: width 0.6s ease;
    }

    .prob-item.top .prob-bar-fill {
      background: linear-gradient(90deg, var(--accent), var(--green));
    }

    .prob-pct {
      font-family: var(--mono);
      font-size: 15px;
      color: var(--sub);
      width: 52px;
      text-align: right;
      flex-shrink: 0;
    }

    .prob-item.top .prob-pct { color: var(--green); font-weight: 500; }

    /* Spinner */
    .spinner {
      display: none;
      width: 44px;
      height: 44px;
      border: 4px solid var(--border);
      border-top-color: var(--accent);
      border-radius: 50%;
      animation: spin 0.7s linear infinite;
      margin: 60px auto;
    }

    @keyframes spin { to { transform: rotate(360deg); } }

    /* Error */
    .error-msg {
      display: none;
      background: #1a0a0a;
      border: 1px solid #3e1a1a;
      border-radius: 12px;
      padding: 16px 18px;
      color: #ff6b6b;
      font-family: var(--mono);
      font-size: 14px;
      margin: 18px;
    }
  </style>
</head>
<body>

  <header>
    <h1>🌤 Weather Classifier</h1>
    <p>EfficientNetB0 · 11 Weather Classes · Deep Learning</p>
  </header>

  <div class="container">

    <!-- Upload Card -->
    <div class="card upload-card">
      <div class="upload-zone" id="uploadZone">
        <input type="file" id="fileInput" accept=".jpg,.jpeg,.png,.webp,.bmp" />
        <img class="preview-img" id="previewImg" style="display:none" />
        <div class="preview-overlay" id="previewOverlay" style="display:none">
          <span>Change Image</span>
        </div>
        <div id="uploadPlaceholder">
          <div class="upload-icon">🖼️</div>
          <div class="upload-title">Choose a picture</div>
          <div class="upload-sub">jpg · png · webp · bmp</div>
        </div>
      </div>
      <button class="predict-btn" id="predictBtn" disabled>
        ✦ Classify Weather
      </button>
      <div class="error-msg" id="errorMsg"></div>
    </div>

    <!-- Result Card -->
    <div class="card result-card">
      <div class="empty-state" id="emptyState">
        <div class="empty-icon">🌡️</div>
        <div class="empty-text">No prediction yet</div>
        <div class="empty-sub">Upload an image to begin</div>
      </div>

      <div class="spinner" id="spinner"></div>

      <div class="result-content" id="resultContent">
        <div class="result-label">Detected Weather</div>
        <div class="result-class" id="resultClass">—</div>
        <div class="result-conf"  id="resultConf">—</div>
        <div class="bar-bg"><div class="bar-fill" id="barFill"></div></div>
        <div class="prob-label">All Classes</div>
        <div class="prob-list" id="probList"></div>
      </div>
    </div>

  </div>

  <script>
    const fileInput         = document.getElementById('fileInput');
    const uploadZone        = document.getElementById('uploadZone');
    const previewImg        = document.getElementById('previewImg');
    const previewOverlay    = document.getElementById('previewOverlay');
    const uploadPlaceholder = document.getElementById('uploadPlaceholder');
    const predictBtn        = document.getElementById('predictBtn');
    const emptyState        = document.getElementById('emptyState');
    const spinner           = document.getElementById('spinner');
    const resultContent     = document.getElementById('resultContent');
    const resultClass       = document.getElementById('resultClass');
    const resultConf        = document.getElementById('resultConf');
    const barFill           = document.getElementById('barFill');
    const probList          = document.getElementById('probList');
    const errorMsg          = document.getElementById('errorMsg');

    const EMOJI = {
      dew:'💧', fogsmog:'🌫️', frost:'🧊', glaze:'✨', hail:'🌨️',
      lightning:'⚡', rain:'🌧️', rainbow:'🌈', rime:'❄️',
      sandstorm:'🏜️', snow:'☃️'
    };

    let selectedFile = null;

    uploadZone.addEventListener('dragover',  e => { e.preventDefault(); uploadZone.classList.add('dragover'); });
    uploadZone.addEventListener('dragleave', () => uploadZone.classList.remove('dragover'));
    uploadZone.addEventListener('drop', e => {
      e.preventDefault();
      uploadZone.classList.remove('dragover');
      const file = e.dataTransfer.files[0];
      if (file) handleFile(file);
    });

    // Clicking the overlay (Change Image) triggers file picker
    previewOverlay.addEventListener('click', e => {
      e.stopPropagation();
      fileInput.value = '';       // reset so same file can be re-selected
      fileInput.click();
    });

    fileInput.addEventListener('change', () => {
      if (fileInput.files[0]) handleFile(fileInput.files[0]);
    });

    function handleFile(file) {
      selectedFile = file;
      const reader = new FileReader();
      reader.onload = e => {
        previewImg.src = e.target.result;
        previewImg.style.display    = 'block';
        previewOverlay.style.display = 'flex';
        uploadPlaceholder.style.display = 'none';
      };
      reader.readAsDataURL(file);
      predictBtn.disabled        = false;
      errorMsg.style.display     = 'none';
    }

    predictBtn.addEventListener('click', async () => {
      if (!selectedFile) return;

      emptyState.style.display = 'none';
      resultContent.classList.remove('visible');
      spinner.style.display    = 'block';
      predictBtn.disabled      = true;
      errorMsg.style.display   = 'none';

      const formData = new FormData();
      formData.append('image', selectedFile);

      try {
        const res  = await fetch('/predict', { method: 'POST', body: formData });
        const data = await res.json();
        if (data.error) throw new Error(data.error);

        const emoji = EMOJI[data.predicted_class] || '🌡️';
        resultClass.textContent = `${emoji} ${data.predicted_class}`;
        resultConf.textContent  = `Confidence: ${data.confidence.toFixed(2)}%`;

        setTimeout(() => { barFill.style.width = `${Math.min(data.confidence, 100)}%`; }, 50);

        const sorted = Object.entries(data.all_probs).sort((a, b) => b[1] - a[1]);
        probList.innerHTML = sorted.map(([name, prob], i) => `
          <div class="prob-item ${i === 0 ? 'top' : ''}">
            <span class="prob-name">${EMOJI[name] || ''} ${name}</span>
            <div class="prob-bar-bg">
              <div class="prob-bar-fill" style="width:${prob}%"></div>
            </div>
            <span class="prob-pct">${prob.toFixed(1)}%</span>
          </div>
        `).join('');

        spinner.style.display = 'none';
        resultContent.classList.add('visible');

      } catch (err) {
        spinner.style.display    = 'none';
        emptyState.style.display = 'flex';
        errorMsg.textContent     = `❌ ${err.message}`;
        errorMsg.style.display   = 'block';
      }

      predictBtn.disabled = false;
    });
  </script>
</body>
</html>
